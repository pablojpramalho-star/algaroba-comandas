<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Algaroba Tablet - Compatibilidade</title><style>body{font-family:Arial,sans-serif;background:#143d2a;color:white;margin:0;padding:16px}h1{font-size:23px;color:#ffbf55}.panel{background:#243a30;padding:15px;border-radius:9px;margin:12px 0}input,button{box-sizing:border-box;width:100%;font-size:18px;padding:13px;margin:7px 0;border-radius:6px;border:0}button{background:#f8b52d;color:#152318;font-weight:bold}.secondary{background:#e1e9e2}#error{color:#ffb7a4;white-space:pre-wrap}.table{background:#f2f5ed;color:#173321;padding:14px;margin:8px 0;border-radius:6px}.small{font-size:13px;color:#d7dfd6}</style></head><body><h1>🌳 Algaroba Shakes Grills</h1><div class="small">Terminal tablet • compatibilidade Android 4.4 • diagnóstico de acesso</div><div class="panel" id="login"><h2>Entrar</h2><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Senha"><button id="enter" onclick="login()">ENTRAR</button><p id="error"></p></div><div id="app" style="display:none"><div class="panel"><b id="operator"></b><p id="status">Conectado</p><button class="secondary" onclick="refresh()">ATUALIZAR MESAS</button><button class="secondary" onclick="logout()">SAIR</button></div><div class="panel"><b>Mesas (consulta sincronizada a cada 15 segundos)</b><p class="small">Não lançar pedidos nesta página até a sincronização de escrita ser validada.</p><div id="tables"></div></div></div><script>var BASE='https://dlwrmpfurphccaeuwsfj.supabase.co';var KEY='sb_publishable_0Yr-97uqdGFXAcSvpZ2IGA_G3DpnaB7';var token='';var refreshTimer=null;function el(id){return document.getElementById(id)}function message(t){el('error').textContent=t}function request(path,method,body,cb){var xhr=new XMLHttpRequest();xhr.open(method,BASE+path,true);xhr.setRequestHeader('apikey',KEY);xhr.setRequestHeader('Content-Type','application/json');if(token)xhr.setRequestHeader('Authorization','Bearer '+token);xhr.onreadystatechange=function(){if(xhr.readyState!==4)return;var data=null;try{data=JSON.parse(xhr.responseText)}catch(e){}if(xhr.status>=200&&xhr.status<300)cb(null,data);else cb(new Error((data&&(data.msg||data.message||data.error_description))||('HTTP '+xhr.status+' • '+xhr.responseText.slice(0,120))))};xhr.onerror=function(){cb(new Error('Falha de rede / certificado. Confira data, hora e conexão.'))};xhr.send(body?JSON.stringify(body):null)}function login(){var email=el('email').value.replace(/^\s+|\s+$/g,''),password=el('password').value;if(!email||!password){message('Informe e-mail e senha.');return}el('enter').disabled=true;el('enter').textContent='ENTRANDO...';message('');request('/auth/v1/token?grant_type=password','POST',{email:email,password:password},function(err,data){if(err){el('enter').disabled=false;el('enter').textContent='ENTRAR';message(err.message);return}token=data.access_token;el('password').value='';request('/rest/v1/algaroba_users?select=id,nome,perfil,ativo&id=eq.'+encodeURIComponent(data.user.id),'GET',null,function(e,rows){el('enter').disabled=false;el('enter').textContent='ENTRAR';if(e||!rows||!rows.length||!rows[0].ativo){token='';message(e?e.message:'Usuário sem acesso ativo.');return}el('operator').textContent=rows[0].nome+' • '+rows[0].perfil;el('login').style.display='none';el('app').style.display='block';refresh();if(refreshTimer)clearInterval(refreshTimer);refreshTimer=setInterval(refresh,15000)})})}function refresh(){el('status').textContent='Consultando servidor...';request('/rest/v1/algaroba_records?select=record_key,data&record_key=like.table:*','GET',null,function(err,rows){if(err){el('status').textContent=err.message;return;}el('status').textContent='ONLINE • '+(rows?rows.length:0)+' mesas recebidas';var root=el('tables');while(root.firstChild){root.removeChild(root.firstChild);}rows=rows||[];rows.sort(function(a,b){return Number(a.data.id)-Number(b.data.id);});for(var i=0;i<rows.length;i++){var t=rows[i].data;var div=document.createElement('div');var items=t.items||[];var total=0;for(var j=0;j<items.length;j++){total+=Number(items[j].price||0)*Number(items[j].qty||0);}div.className='table';div.textContent='Mesa '+t.id+' • '+(t.status||'livre')+' • '+items.length+' itens • R$ '+total.toFixed(2).replace('.',',');root.appendChild(div);}});}function logout(){if(refreshTimer){clearInterval(refreshTimer);refreshTimer=null}token='';el('app').style.display='none';el('login').style.display='block';el('password').value='';message('Sessão encerrada.')}</script></body></html>
