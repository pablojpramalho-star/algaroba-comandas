<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b3324">\n  <meta name="color-scheme" content="light">
  <meta name="description" content="Portal de pedidos e gestão da fábrica Algaroba">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="../algaroba-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./app.css?v=20261006-premium2">
  <title>Algaroba — Natural como nossa terra</title>
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <button class="brand" type="button" data-go="home" aria-label="Ir para o início">
      <img src="../algaroba-icon.svg" alt="" class="brand-logo">
      <span class="brand-copy"><strong>Algaroba</strong><small>NATURAL COMO NOSSA TERRA</small></span>
    </button>
    <div class="top-actions">
      <button class="top-button" id="accountButton" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-4 3.1-6 7-6s6.2 2 7 6"/></svg><span id="accountLabel">Entrar</span></button>
      <button class="top-button cart-button" id="cartButton" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.2 10.5h9.7L20 7H6"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg><span class="cart-count" id="cartCount">0</span></button>
    </div>
  </header>

  <div class="offline-banner hidden" id="offlineBanner">Você está sem internet. O carrinho continua salvo neste aparelho.</div>

  <main id="main" class="main"></main>

  <nav id="clientNav" class="bottom-nav">
    <button type="button" data-go="home" data-nav="home"><span><svg viewBox="0 0 24 24"><path d="m3 11 9-7 9 7"/><path d="M6 10v10h12V10M10 20v-6h4v6"/></svg></span><small>Início</small></button>
    <button type="button" data-go="catalog" data-nav="catalog"><span><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></span><small>Fazer pedido</small></button>
    <button type="button" data-go="cart" data-nav="cart"><span><svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 10.5h9.7L20 7H6"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg></span><small>Carrinho</small></button>
    <button type="button" data-go="orders" data-nav="orders"><span><svg viewBox="0 0 24 24"><path d="M6 4h12v16H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></span><small>Pedidos</small></button>
    <button type="button" data-go="info" data-nav="info"><span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 10v7M12 7h.01"/></svg></span><small>Informações</small></button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
<script type="module" src="./app.js?v=20261006-premium2"></script>
</body>
</html>
